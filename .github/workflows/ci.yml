name: gRPCCCurl Container
on:
  push:
    tags:
      - 'v/**'
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: grpcccurl
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Determine tags
      id: tags
      env:
        REF: ${{ github.ref }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        BASE="${IMAGE_REGISTRY}/${IMAGE_NAME}"
        UPSTREAM=$(sed -n 's/^ARG GRPCURL_VERSION=//p' Containerfile)
        VERSION="${SHA}"
        TAGS="${BASE}:${SHA}"

        if [[ "${REF}" == refs/tags/v/* ]]; then
          VERSION="${REF_NAME#v/}"
          if [[ ! "${VERSION}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            echo "Tag must look like v/<upstream>-<revision>, got ${REF_NAME}" >&2
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "${UPSTREAM}" ]]; then
            echo "Tag upstream ${BASH_REMATCH[1]} does not match Containerfile ${UPSTREAM}" >&2
            exit 1
          fi
          TAGS="${BASE}:${VERSION} ${BASE}:${UPSTREAM} ${BASE}:latest ${TAGS}"
        fi

        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
        echo "Generated tags: ${TAGS}"

    - name: Get build timestamp
      id: timestamp
      run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Build image
      id: build_image
      uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
      with:
        tags: ${{ steps.tags.outputs.tags }}
        archs: amd64, arm64, arm/v7, riscv64
        containerfiles: |
          ./Containerfile
        labels: |
          org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          org.opencontainers.image.created=${{ steps.timestamp.outputs.created }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Push to GHCR
      uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
      id: push
      with:
        tags: ${{ steps.build_image.outputs.tags }}
        username: ${{ env.REGISTRY_USER }}
        password: ${{ env.REGISTRY_PASSWORD }}
